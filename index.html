  <meta name="twitter:description" content="Upload your CV, get AI skill extraction, and discover jobs that match your expertise with semantic matching.">
  <!-- Prevent FOUC: apply theme class before React boots (localStorage → OS → dark). -->
  <script>
    (function () {
      try {
        var key = "jobai_theme";
        var stored = null;
        try { stored = localStorage.getItem(key); } catch (e) {}
        var theme = (stored === "light" || stored === "dark") ? stored : null;
        if (!theme) {
          try {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          } catch (e) {
            theme = "dark";
          }
        }
        var root = document.documentElement;
        root.classList.remove("light", "dark");
        root.classList.add(theme);
        root.style.colorScheme = theme;
        root.dataset.theme = theme;
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
