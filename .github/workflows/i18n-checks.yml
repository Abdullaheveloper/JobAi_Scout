name: i18n-checks

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/audit-untranslated.mjs"
      - "scripts/verify-i18n-completeness.mjs"
      - "scripts/verify-locale-parity.mjs"
      - "src/locales/**"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "src/locales/**"
      - "scripts/**"
      - "eslint.config.js"

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Locale key completeness
        run: npm run i18n:check
      - name: Critical-page untranslated audit
        run: npm run i18n:audit:strict
      - name: ESLint i18n gate (critical pages)
        run: npm run lint:i18n
